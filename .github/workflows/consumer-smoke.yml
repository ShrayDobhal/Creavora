name: Consumer Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/creavora_ci?schema=public"
      JWT_ACCESS_SECRET: "ci-access-secret-with-at-least-32-bytes"
      JWT_REFRESH_SECRET: "ci-refresh-secret-with-at-least-32-bytes"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: "npm ci"
      - name: Validate Prisma schema
        run: "npx prisma validate"
      - name: Run tests
        run: "npm run test"
      - name: Lint
        run: "npm run lint"
      - name: Build
        run: "npm run build"
